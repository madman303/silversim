# ============================================
# SilverSim 配置文件
# 修改本文件即可运行不同情景，无需改动代码
# ============================================

simulation:
  years: 5                      # 仿真年数
  replan_interval: 2            # 每几年触发一次重规划
  random_seed: 42               # 随机种子（保证项目的可复现）

# ---------- 人口演化 ----------
population:
  lambda_rate: 0.03             # 年新增自理老人比例
  transitions:                  # 状态转移概率（中心值）
    Z2B: 0.045                  # 自理 → 半失能
    B2S: 0.10                   # 半失能 → 失能
    B2Z: 0.12                   # 半失能 → 自理（康复）
    S2B: 0.05                   # 失能 → 半失能（康复）
    S2Z: 0.005                  # 失能 → 自理（极少）
  death:                        # 分层死亡率
    Z: 0.035
    B: 0.07
    S: 0.16
  migrate_out: 0.008            # 迁出率

# ---------- 需求计算 ----------
demand:
  consumption_limits:           # 月服务消费上限（占收入比例）
    Z: 0.20
    B: 0.25
    S: 0.30
  price_elasticity:             # 价格弹性
    Z: -1.2
    B: -0.9
    S: -0.6
  price_ratio: 1.0              # 当前价格相对基准价的倍数

# ---------- 选址优化 ----------
site:
  annual_build_budget: 1200000  # 年度建设预算（元）
  service_radius: 1000          # 服务半径（米）
  adapt_threshold: 0.7          # 适配度阈值（低于此值禁建大型）
  new_site_efficiency: 0.8      # 新站磨合期容量系数
  salvage_ratio: 0.3            # 关停残值回收比例
  work_days_per_month: 22       # 每月运营工作日

# ---------- 财务测算 ----------
finance:
  max_profit_ratio: 0.08        # 利润率上限
  depreciation_years: 20        # 折旧年限
  nurse_monthly_salary: 4500    # 护理员月薪（元）

# ---------- 站点参数（按规模） ----------
facility:
  scales: [小型, 中型, 大型]
  build_cost:
    小型: 180000
    中型: 320000
    大型: 450000
  daily_fix_cost:
    小型: 2000
    中型: 3200
    大型: 4400
  daily_max_capacity:
    小型: 1000
    中型: 2000
    大型: 3000
  min_nurse_count:
    小型: 2
    中型: 5
    大型: 10

# ---------- 服务价格（基准价，来自附件2） ----------
services:
  names: [助餐, 日间照料, 上门护理, 康复理疗, 助浴, 紧急救助]
  revenue:                      # 单次服务营收（元）
    助餐: 10
    日间照料: 20
    上门护理: 30
    康复理疗: 28
    助浴: 25
    紧急救助: 0
  variable_cost:                # 单次服务直接支出（元）
    助餐: 8
    日间照料: 16
    上门护理: 24
    康复理疗: 23
    助浴: 20
    紧急救助: 8

0 

# ---------- 距离矩阵（单位：米） ----------
distance_matrix:
  - [0, 600, 1200, 900, 1500, 1800, 1300, 700, 1100, 500]
  - [600, 0, 800, 500, 1100, 1400, 900, 400, 700, 300]
  - [1200, 800, 0, 700, 600, 900, 500, 900, 600, 700]
  - [900, 500, 700, 0, 800, 1100, 600, 300, 500, 400]
  - [1500, 1100, 600, 800, 0, 500, 400, 1000, 500, 800]
  - [1800, 1400, 900, 1100, 500, 0, 500, 1200, 700, 1100]
  - [1300, 900, 500, 600, 400, 500, 0, 800, 400, 600]
  - [700, 400, 900, 300, 1000, 1200, 800, 0, 600, 300]
  - [1100, 700, 600, 500, 500, 700, 400, 600, 0, 400]
  - [500, 300, 700, 400, 800, 1100, 600, 300, 400, 0]

# ---------- 需求矩阵（每人每月服务次数） ----------
demand_matrix:
  # 行：自理 / 半失能 / 失能
  # 列：与 services.names 顺序一致
  Z: [14, 8, 0, 2, 0, 0.15]
  B: [20, 14, 6, 4, 2, 1]
  S: [22, 18, 12, 6, 4, 3]